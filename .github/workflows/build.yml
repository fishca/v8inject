name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            cmake_arch: Win32
          - arch: x64
            cmake_arch: x64

    steps:
      - uses: actions/checkout@v4

      - name: Locate Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere not found" }
          Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio" -ErrorAction SilentlyContinue
          & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath

      - name: Configure
        run: >
          cmake -S . -B build/${{ matrix.arch }}
          -G "Visual Studio 17 2022" -A ${{ matrix.cmake_arch }}
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: |
          $out = cmake --build build/${{ matrix.arch }} --config Release --parallel 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            # Logs need a GitHub login; annotations are visible without one, so
            # the compiler errors are re-emitted here.
            ($out -split "`r?`n" | Where-Object { $_ -match 'error|fatal' } | Select-Object -First 10) |
              ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }

      - name: Verify artifacts
        shell: pwsh
        run: |
          $dir = "build/${{ matrix.arch }}/bin/${{ matrix.arch }}"
          Get-ChildItem $dir
          foreach ($f in @('v8inject.exe', 'v8inject-gui.exe', 'v8i_payload.dll')) {
            if (-not (Test-Path "$dir/$f")) {
              throw "missing artifact: $dir/$f"
            }
          }

      - name: Smoke test
        shell: pwsh
        run: |
          $dir = "build/${{ matrix.arch }}/bin/${{ matrix.arch }}"
          & "$dir/v8inject.exe" --help
          if ($LASTEXITCODE -ne 0) { throw "v8inject --help failed" }

      # cli_help plus hook_smoke: the latter injects the payload into
      # v8i_hook_target.exe, hooks a function with known arguments and checks the
      # recorded call.
      - name: Run tests
        shell: pwsh
        run: |
          $out = ctest --test-dir build/${{ matrix.arch }} -C Release --output-on-failure 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            # Keep the transcript short: GitHub shows at most 10 annotations per
            # step, and the trace reply is a single huge line. Short lines only,
            # deduplicated (ctest prints the test output twice), FAIL first.
            $lines = $out -split "`r?`n"
            $short = $lines | Where-Object { $_.Length -le 400 }
            $keep = @()
            $keep += $short | Where-Object { $_ -match 'FAIL' }
            $keep += $short | Where-Object { $_ -match 'target pid|LINE:|scan failed|"id":|"status":"error"|installed|no records' }
            $last = @()
            # The payload logs every request byte-for-byte as it sees it -- that
            # shows whether the malformed command is a host or a payload problem.
            # These lines go FIRST: GitHub caps a step at ten annotations.
            $log = "build/${{ matrix.arch }}/bin/${{ matrix.arch }}/v8inject.log"
            if (Test-Path $log) {
              # Only the FIRST hook exchange fits under the annotation cap, and
              # that is the one in question: the host's Call(...) line says
              # whether it was posted or BUSY, the payload's line says what text
              # it received.
              $last += Get-Content $log |
                Where-Object { $_ -match 'Call\(hook|command received: hook' } |
                Select-Object -First 4
            }
            $fail = $keep | Where-Object { $_ -match 'FAIL' } | Select-Object -Unique -First 2
            ($last + $fail) | Select-Object -Unique | Select-Object -First 12 |
              ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: v8inject-${{ matrix.arch }}
          path: build/${{ matrix.arch }}/bin/${{ matrix.arch }}/*
          if-no-files-found: error
