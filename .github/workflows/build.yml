name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            cmake_arch: Win32
          - arch: x64
            cmake_arch: x64

    steps:
      - uses: actions/checkout@v4

      - name: Locate Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere not found" }
          Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio" -ErrorAction SilentlyContinue
          & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath

      - name: Configure
        run: >
          cmake -S . -B build/${{ matrix.arch }}
          -G "Visual Studio 17 2022" -A ${{ matrix.cmake_arch }}
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/${{ matrix.arch }} --config Release --parallel

      - name: Verify artifacts
        shell: pwsh
        run: |
          $dir = "build/${{ matrix.arch }}/bin/${{ matrix.arch }}"
          Get-ChildItem $dir
          foreach ($f in @('v8inject.exe', 'v8i_payload.dll')) {
            if (-not (Test-Path "$dir/$f")) {
              throw "missing artifact: $dir/$f"
            }
          }

      - name: Smoke test
        shell: pwsh
        run: |
          $dir = "build/${{ matrix.arch }}/bin/${{ matrix.arch }}"
          & "$dir/v8inject.exe" --help
          if ($LASTEXITCODE -ne 0) { throw "v8inject --help failed" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: v8inject-${{ matrix.arch }}
          path: build/${{ matrix.arch }}/bin/${{ matrix.arch }}/*
          if-no-files-found: error
